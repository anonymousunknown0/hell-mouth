function insertSoundtrackTile(gridElement) {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `
    <img src="soundtrack.gif" class="tile-image" />
    <div class="tile-label">official hellmouth soundtrack</div>
  `;
  tile.onclick = () => openSoundtrackPlayer();
  gridElement.insertBefore(tile, gridElement.firstChild);
}

function openSoundtrackPlayer() {
  const overlay = document.createElement("div");
  overlay.className = "overlay";

  const container = document.createElement("div");
  container.className = "soundtrack-container";

  const closeBtn = document.createElement("button");
  closeBtn.innerText = "Close";
  closeBtn.className = "close-btn";
  closeBtn.onclick = () => document.body.removeChild(overlay);

  const shuffleBtn = document.createElement("button");
  shuffleBtn.innerText = "Shuffle";
  shuffleBtn.onclick = () => {
    const audios = container.querySelectorAll("audio");
    const randomIndex = Math.floor(Math.random() * audios.length);
    audios[randomIndex].play();
  };

  container.appendChild(closeBtn);
  container.appendChild(shuffleBtn);

  soundtrackTracks.forEach(track => {
    const trackEl = document.createElement("div");
    trackEl.className = "track";

    const label = document.createElement("p");
    label.innerText = `${track.title} — ${track.artist}`;

    const audio = document.createElement("audio");
    audio.src = track.filename;
    audio.controls = true;
    audio.loop = true;

    trackEl.appendChild(label);
    trackEl.appendChild(audio);
    container.appendChild(trackEl);
  });

  overlay.appendChild(container);
  document.body.appendChild(overlay);
}

// --- CUSTOM COVER LOGIC ---
function getTileCover(f) {
  // Custom: all .script.txt = galaxy.gif
  if (f.endsWith('.script.txt')) return 'galaxy.gif';

  if (customChapterCovers[f]) return customChapterCovers[f];

// --- CLOSE CONTENT ---
function closeContent() {
  document.getElementById('content').style.display = 'none';
  document.getElementById('puzzle-grid').style.display = 'flex';
  document.querySelectorAll('#content-area audio, #content-area video').forEach(m => { m.pause && m.pause(); m.currentTime = 0; });
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  if (ttsUtterance) { window.speechSynthesis.cancel(); ttsUtterance = null; }
}

// --- BREAK THE SPIRAL ---
function breakSpiral() {
  playClickOnce();
  // If the spiral is already active, stop and clear everything.
  if (spiralAudio || videoEls.length) {
    if (spiralAudio) {
      spiralAudio.pause();
      spiralAudio = null;
    }
    videoEls.forEach(v => v.remove());
    videoEls = [];
    document.getElementById('break-btn').textContent = 'BREAK THE SPIRAL';
    return;
  }

  // Flash effect for fun
  const flash = document.createElement('div');
  Object.assign(flash.style, {
    position: 'fixed', inset: 0, background: '#fff', opacity: 1, zIndex: 10000, transition: 'opacity 0.6s'
  });
  document.body.appendChild(flash);
  requestAnimationFrame(() => flash.style.opacity = '0');
  flash.addEventListener('transitionend', () => flash.remove());

  // --- Play break the spiral.mp3 ---
  spiralAudio = new Audio('break the spiral.mp3');
  spiralAudio.loop = true;
  spiralAudio.volume = 1.0;
  spiralAudio.play();

  // --- Show floating videos from main video files ---
  files.filter(f => /\.(mp4|mov)$/i.test(f)).forEach(file => {
    const v = document.createElement('video');
    v.src = file;
    v.autoplay = v.loop = true;
    v.muted = true;
    const size = 100 + Math.random() * 200;
    Object.assign(v.style, {
      position: 'fixed',
      width: size + 'px',
      top: Math.random() * (window.innerHeight - size) + 'px',
      left: Math.random() * (window.innerWidth - size) + 'px',
      zIndex: 999,
      pointerEvents: 'none',
      borderRadius: '22px',
      boxShadow: '0 0 18px #000c'
    });
    document.body.appendChild(v);
    videoEls.push(v);
  });

  document.getElementById('break-btn').textContent = 'STOP SPIRAL';
}

// --- SCHIZOPHRENIA BUTTON LOGIC ---
function playSchizophrenia() {
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  schizAudio = new Audio('schizophrenia.mp3');
  schizAudio.loop = true;
  schizAudio.volume = 1.0;
  schizAudio.addEventListener('loadedmetadata', () => {
    if (schizAudio.duration > 3) {
      schizAudio.currentTime = Math.random() * (schizAudio.duration - 2);
    }
    schizAudio.play();
  });
  schizAudio.play();
}

// --- TEXT-TO-SPEECH FOR SCRIPTS ---
let ttsVoices = [];
function loadVoices() {
  ttsVoices = window.speechSynthesis.getVoices();
  // Some browsers require this hack to load voices the first time:
  if (!ttsVoices.length) setTimeout(loadVoices, 150);
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function speakScript(text, voiceIdx) {
  if (!window.speechSynthesis) return;
  if (ttsUtterance) window.speechSynthesis.cancel();
  ttsUtterance = new SpeechSynthesisUtterance(text);
  if (ttsVoices[voiceIdx]) ttsUtterance.voice = ttsVoices[voiceIdx];
  ttsUtterance.rate = 1.0;
  window.speechSynthesis.speak(ttsUtterance);
}
function stopSpeakScript() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  ttsUtterance = null;
}

// --- OPEN / CLOSE CONTENT —
function openFile(file) {
  playClickOnce();
if (file === "soundtrack") {
  document.getElementById("soundtrack-overlay").style.display = "flex";
  displaySoundtrackList();
  return;
}

  // Happy gallery handling
  if (file === "happy gallery") {
    openHappyFileList(happyFiles, "happy gallery");
    return;
  }
  if (file === "happy gallery 2") {
    openHappyFileList(happyFiles2, "happy gallery 2");
    return;
  }
  const grid    = document.getElementById('puzzle-grid');
  const content = document.getElementById('content');
  const area    = document.getElementById('content-area');
  document.getElementById('file-name').innerText = file;
  area.innerHTML = '';
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  if (ttsUtterance) { window.speechSynthesis.cancel(); ttsUtterance = null; }
  const ext = file.split('.').pop().toLowerCase();
  // Audio
  if (['mp3','wav','m4a'].includes(ext)) {
    area.innerHTML = `<audio controls autoplay loop src="${file}"></audio>`;
  }
  // Script
  else if (file.endsWith('.script.txt')) {
    area.innerHTML = `
      <button class="schiz-btn" onclick="playSchizophrenia()">SCHIZOPHRENIA</button>
      <select class="voice-select" id="voiceSelect"></select>
      <button class="tts-btn" onclick="doSpeakScript()">Speak</button>
      <button class="stop-btn" onclick="stopSpeakScript()">Stop</button>
      <div style="color:#fff;">Loading script…</div>`;
    fetch(file).then(r => r.text()).then(txt => {
      area.innerHTML = `
        <button class="schiz-btn" onclick="playSchizophrenia()">SCHIZOPHRENIA</button>
        <select class="voice-select" id="voiceSelect"></select>
        <button class="tts-btn" onclick="doSpeakScript()">Speak</button>
        <button class="stop-btn" onclick="stopSpeakScript()">Stop</button>
        <pre>${txt.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>
        <button class="copy-btn" onclick="copyScript()">COPY SCRIPT</button>`;
      loadVoicesToSelect();
    });
  }
  // Video
  else {
    area.innerHTML = `
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
        <video id="main-video" controls autoplay src="${file}" style="max-width:92vw;max-height:74vh;border-radius:12px;"></video>
        <div>
          <label>Speed:
            <select id="video-speed" onchange="setVideoSpeed()">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
        </div>
      </div>
    `;
    const vid = area.querySelector('#main-video');
    if (file === 'do you understand.mp4') {
      vid.loop = false;
      vid.onended = () => {
        if (!unlocked) {
          unlocked = true;
          displayTiles();
          alert('🔓 Happy gallery 1 unlocked!');
        } else if (!unlocked2) {
          unlocked2 = true;
          displayTiles();
          alert('🔓 Happy gallery 2 unlocked!');
        }
      };
    } else {
      vid.loop = true;
    }
  }
  grid.style.display    = 'none';
  content.style.display = 'flex';
}

// --- TTS LOGIC: LOAD VOICES ---
function loadVoicesToSelect() {
  const select = document.getElementById('voiceSelect');
  if (!select) return;
  select.innerHTML = '';
  ttsVoices.forEach((voice, idx) => {
    select.innerHTML += `<option value="${idx}">${voice.name} (${voice.lang})</option>`;
  });
}
function doSpeakScript() {
  const pre = document.querySelector('#content-area pre');
  const select = document.getElementById('voiceSelect');
  if (pre && select) speakScript(pre.innerText, select.value);
}
