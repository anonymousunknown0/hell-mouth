// --- BREAK THE SPIRAL ---
function breakSpiral() {
  playClickOnce();
  if (spiralAudio || audioSources.length || videoEls.length) {
    if (spiralAudio) { spiralAudio.pause(); spiralAudio = null; }
    audioSources.forEach(s => s.stop && s.stop());
    audioSources = [];
    videoEls.forEach(v => v.remove());
    videoEls = [];
    document.getElementById('break-btn').textContent = 'BREAK THE SPIRAL';
    return;
  }
  // White flash effect
  const flash = document.createElement('div');
  Object.assign(flash.style, {
    position: 'fixed', inset: 0,
    background: '#fff', opacity: 1,
    zIndex: 10000, transition: 'opacity 0.6s'
  });
  document.body.appendChild(flash);
  requestAnimationFrame(() => flash.style.opacity = '0');
  flash.addEventListener('transitionend', () => flash.remove());
  // Play break the spiral.mp3 from a random point, loop
  spiralAudio = new Audio('break the spiral.mp3');
  spiralAudio.loop = true;
  spiralAudio.volume = 1.0;
  spiralAudio.addEventListener('loadedmetadata', () => {
    if (spiralAudio.duration > 3) {
      spiralAudio.currentTime = Math.random() * (spiralAudio.duration - 2);
    }
    spiralAudio.play();
  });
  spiralAudio.play();
  // Floating videos (all .mp4/.mov from files array)
  files.filter(f => /\.(mp4|mov)$/i.test(f)).forEach(file => {
    const v = document.createElement('video');
    v.src = file;
    v.autoplay = v.loop = true;
    v.muted = true;
    const size = 100 + Math.random() * 200;
    Object.assign(v.style, {
      position: 'fixed',
      width: size + 'px',
      top: Math.random() * (window.innerHeight - size) + 'px',
      left: Math.random() * (window.innerWidth - size) + 'px',
      zIndex: 999
    });
    document.body.appendChild(v);
    videoEls.push(v);
  });
  document.getElementById('break-btn').textContent = 'STOP SPIRAL';
}

      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <div>
          <video id="main-video" controls autoplay src="${file}" style="max-width:92vw;max-height:74vh;border-radius:12px;"></video>
        </div>
        <div style="margin-top: 8px;">
          <label>Speed: 
            <select id="video-speed" onchange="setVideoSpeed()">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </label>
        </div>
        <button class="close-btn" onclick="closeContent()">CLOSE</button>
      </div>
    `;
    const vid = area.querySelector('#main-video');
    if (file === 'do you understand.mp4') {
      vid.loop = false;
      vid.onended = () => {
        doYouUnderstandCount++;
        if (doYouUnderstandCount === 1 && !unlocked1) {
          unlocked1 = true;
          displayTiles();
          alert('🔓 Happy Gallery 1 unlocked!');
        }
        if (doYouUnderstandCount === 2 && !unlocked2) {
          unlocked2 = true;
          displayTiles();
          alert('🔓 Happy Gallery 2 unlocked!');
        }
      };
    } else {
      vid.loop = true;
    }
  }

  grid.style.display    = 'none';
  content.style.display = 'flex';
}

function closeContent() {
  document.getElementById('content').style.display = 'none';
  document.getElementById('puzzle-grid').style.display = 'flex';
  document.querySelectorAll('#content-area audio, #content-area video')
    .forEach(m => { m.pause && m.pause(); m.currentTime = 0; });
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  // Also close happy modal if present
  closeHappyModal();
}

// --- SPEED BUTTON LOGIC ---
function setVideoSpeed() {
  const v = document.getElementById('main-video');
  const s = document.getElementById('video-speed');
  if (v && s) v.playbackRate = parseFloat(s.value);
}

// --- SCHIZOPHRENIA BUTTON LOGIC ---
function playSchizophrenia() {
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  schizAudio = new Audio('schizophrenia.mp3');
  schizAudio.loop = true;
  schizAudio.volume = 1.0;
  schizAudio.addEventListener('loadedmetadata', () => {
    if (schizAudio.duration > 3) {
      schizAudio.currentTime = Math.random() * (schizAudio.duration - 2);
    }
    schizAudio.play();
  });
  schizAudio.play();
}

// --- COPY SCRIPT BUTTON ---
function copyScript() {
  const pre = document.querySelector('#content-area pre');
  if (pre) {
    navigator.clipboard.writeText(pre.innerText);
    alert('Script copied!');
  }
}

// --- INIT ---
window.addEventListener('DOMContentLoaded', () => {
  displayTiles();
  document.getElementById('break-btn').onclick  = breakSpiral;
  document.getElementById('random-btn').onclick = openRandom;
});
  </script>
</body>
</html>
