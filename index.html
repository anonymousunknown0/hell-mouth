    body {

      background-size: cover;
      font-family: monospace;
      color: #eee;
      overflow-x: hidden;
      min-height: 100vh;
    }
    /* Entry Screen */
    #entry-screen {
      position: fixed; inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      overflow: hidden;
    }
    #entry-bg-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      z-index: -1;
    }
    #entry-screen h1 {
      color: #ff0000;
      font-size: 6rem;
      letter-spacing: 2rem;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #fff1, 0 10px 15px #e00c;
      animation: melt 3s infinite alternate;
    }
    @keyframes melt {
      0%,100% { text-shadow:0 0 0 #000; }
      50%    { text-shadow:0 12px 4px #b00; }
    }
    #entry-screen button {
      padding: 14px 40px;
      font-size: 1.4rem;
      background: #000;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 12px;
      cursor: pointer;
    }
    /* Emotion Wheel */
    #wheel-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffd700;
    }
    .emotion-btn {
      margin: 6px;
      padding: 12px 24px;
      border: 2px solid #ffd700;
      color: #ffd700;
      background: #222;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .emotion-btn:hover { background: #ffd700; color: #111; }
    /* Puzzle Grid */
    .puzzle-grid {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      padding: 30px 10px 140px;
    }
    .tile {
      position: relative;
      width: 190px; height: 106px;
      background: rgba(0,0,0,0.15);
      border: 2px solid #fff;
      border-radius: 20px;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .tile:hover {
      transform: scale(1.08);
      border-color: #ffd700;
      box-shadow: 0 0 26px #fff8;
    }
    .tile-number {
      position: absolute; top: 8px; left: 12px;
      font-size: 1.4rem; font-weight: bold;
      color: #FFD600;
      text-shadow: 1px 1px 6px #000;
      pointer-events: none;
    }
    .tile-filename {
      position: absolute; bottom: 6px; left:0;
      width:100%; text-align:center;
      font-size:0.85em; font-weight:bold;
      color:#FFD600; background:rgba(0,0,0,0.18);
      padding:2px 4px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;
      pointer-events:none;
    }
    /* Soundtrack Grid */
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .track-card {
      background: #222;
      border: 2px solid #FFD600;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-card h2 { margin: 0; font-size: 1.1rem; color: #FFD600; }
    .track-card p  { margin: 0; font-size: 0.9rem; color: #ccc; }
    .track-card audio { width: 100%; outline: none; }
    /* Buttons */
    #break-btn, #random-btn {
      display: none;
      position: fixed; left: 50%; transform: translateX(-50%);
      z-index: 5000;
    }
    #break-btn {
      bottom: 32px;
      background: #fff; color: #000;
      border: 4px solid #000;
      border-radius: 25px;
      padding: 12px 38px;
      font-size: 2em; font-weight:900;
    }
    #random-btn {
      bottom: 100px;
      background: #333; color:#ffd700;
      border:3px solid #ffd700;
      border-radius:20px;
      padding:8px 24px;
    }
    #reset-btn {
      position: fixed; bottom: 12px; left: 12px;
      background: #ff0070; color: #fff;
      padding: 8px 16px;
      border: none; border-radius: 8px;
      cursor: pointer; z-index: 5100;
      font-size: 1rem;
    }
    /* Content Modal */
    #content {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.93);
      padding: 30px 10px;
      overflow-y: auto;
      z-index: 6000;
    }
    #content-area {
      margin: 12vh auto 0;
      width: 100%; max-width: 700px;
    }
    #content-area video, audio {
      width: 100%; border-radius: 12px; margin-bottom: 16px;
    }
    .close-btn {
      display: block; margin: 12px auto;
      padding: 8px 24px;
      background: rgba(0,0,0,0.5); color: #fff;
      border: none; cursor: pointer;
    }
  </style>
