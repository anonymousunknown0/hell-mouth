// --- BREAK THE SPIRAL ---
function breakSpiral() {
  playClickOnce();
  if (spiralAudio || audioSources.length || videoEls.length) {
    if (spiralAudio) { spiralAudio.pause(); spiralAudio = null; }
    audioSources.forEach(s => s.stop && s.stop());

    return;

  const flash = document.createElement('div');
  Object.assign(flash.style, {
    position: 'fixed', inset: 0,
    background: '#fff', opacity: 1,
    zIndex: 10000, transition: 'opacity 0.6s'
  });
  document.body.appendChild(flash);
  requestAnimationFrame(() => flash.style.opacity = '0');
  flash.addEventListener('transitionend', () => flash.remove());
  spiralAudio = new Audio('break the spiral.mp3');
  spiralAudio.loop = true;
  spiralAudio.volume = 1.0;
  spiralAudio.addEventListener('loadedmetadata', () => {
    if (spiralAudio.duration > 3) {
      spiralAudio.currentTime = Math.random() * (spiralAudio.duration - 2);
    }
    spiralAudio.play();
  });
  spiralAudio.play();
  files.filter(f => /\.(mp4|mov)$/i.test(f)).forEach(file => {
    const v = document.createElement('video');
    v.src = file;
    v.autoplay = v.loop = true;
    v.muted = true;
    const size = 100 + Math.random() * 200;
    Object.assign(v.style, {
      position: 'fixed',
      width: size + 'px',
      top: Math.random() * (window.innerHeight - size) + 'px',
      left: Math.random() * (window.innerWidth - size) + 'px',
      zIndex: 999
    });
    document.body.appendChild(v);
    videoEls.push(v);
  });
  document.getElementById('break-btn').textContent = 'STOP SPIRAL';
}

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin:30px 0;">
      <h2 style="color:#FFD700;">${galleryTitle.replace(/gallery/i,'Happy Gallery')}</h2>
      <div class="happy-file-list" style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        ${fileArray.map((f, i) => `
          <button onclick="openSingleHappyVideo('${f.replace(/'/g,"\\'")}', '${galleryTitle}')" 
                  style="background:#111;color:#FFD700;font-size:1.1em;border:2px solid #FFD700;border-radius:10px;padding:8px 24px;cursor:pointer;min-width:240px;">
            ${i+1}. ${f}
          </button>
        `).join('')}
      </div>
    </div>
    <div id="happy-video-modal" style="display:none;position:fixed;inset:0;z-index:5000;background:#000E;align-items:center;justify-content:center;">
      <video id="happy-modal-video" controls autoplay loop style="max-width:92vw;max-height:78vh;border-radius:16px;"></video>
      <div style="margin-top:12px;text-align:center;">
        <label>Speed: 
          <select id="happy-video-speed" onchange="setHappyVideoSpeed()">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
      </div>
      <button onclick="closeHappyModal()" style="position:absolute;top:30px;right:40px;font-size:2em;padding:8px 24px;background:#FFD700;color:#111;border:none;border-radius:10px;cursor:pointer;">CLOSE</button>
    </div>
  `;
  grid.style.display    = 'none';
  content.style.display = 'flex';
}

function openSingleHappyVideo(file, galleryTitle) {
  const modal = document.getElementById('happy-video-modal');
  const vid = document.getElementById('happy-modal-video');
  vid.src = file;
  vid.currentTime = 0;
  vid.play();
  modal.style.display = 'flex';
}

function closeHappyModal() {
  const modal = document.getElementById('happy-video-modal');
  const vid = document.getElementById('happy-modal-video');
  vid.pause();
  vid.src = '';
  modal.style.display = 'none';
}

// --- SPEED BUTTON LOGIC ---
function setVideoSpeed() {
  const v = document.getElementById('main-video');
  const s = document.getElementById('video-speed');
  if (v && s) v.playbackRate = parseFloat(s.value);
}
function setHappyVideoSpeed() {
  const v = document.getElementById('happy-modal-video');
  const s = document.getElementById('happy-video-speed');
  if (v && s) v.playbackRate = parseFloat(s.value);
}

// --- SCHIZOPHRENIA BUTTON LOGIC ---
function playSchizophrenia() {
  if (schizAudio) { schizAudio.pause(); schizAudio = null; }
  schizAudio = new Audio('schizophrenia.mp3');
  schizAudio.loop = true;
  schizAudio.volume = 1.0;
  schizAudio.addEventListener('loadedmetadata', () => {
    if (schizAudio.duration > 3) {
      schizAudio.currentTime = Math.random() * (schizAudio.duration - 2);
    }
    schizAudio.play();
  });
  schizAudio.play();
}

// --- COPY SCRIPT BUTTON ---
function copyScript() {
  const pre = document.querySelector('#content-area pre');
  if (pre) {
    navigator.clipboard.writeText(pre.innerText);
    alert('Script copied!');
  }
}

// --- TTS SCRIPT BUTTON LOGIC ---
let ttsUtterance = null;
function speakScript() {
  stopTTS();
  const txt = document.getElementById('script-txt');
  if (!txt) return;
  ttsUtterance = new SpeechSynthesisUtterance(txt.innerText);
  const voiceSel = document.getElementById('tts-voice');
  if (voiceSel && voiceSel.selectedOptions.length > 0) {
    const selectedVoiceName = voiceSel.selectedOptions[0].value;
    const voices = window.speechSynthesis.getVoices();
    const matched = voices.find(v => v.name === selectedVoiceName);
    if (matched) ttsUtterance.voice = matched;
  }
  ttsUtterance.rate = 1;
  window.speechSynthesis.speak(ttsUtterance);
}
function stopTTS() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
function populateVoiceList() {
  const voiceSel = document.getElementById('tts-voice');
  if (!voiceSel) return;
  let voices = window.speechSynthesis.getVoices();
  voiceSel.innerHTML = '';
  voices.forEach(voice => {
    let opt = document.createElement('option');
    opt.value = voice.name;
    opt.innerText = voice.name + (voice.lang ? ` [${voice.lang}]` : '');
    voiceSel.appendChild(opt);
  });
}
// For browsers where voices are loaded asynchronously
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = populateVoiceList;
}

// --- INIT ---
window.addEventListener('DOMContentLoaded', () => {
  displayTiles();
  document.getElementById('break-btn').onclick  = breakSpiral;
  document.getElementById('random-btn').onclick = openRandom;
});
