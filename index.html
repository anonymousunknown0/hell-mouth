
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HELL-MOUTH</title>
<style>
  body { background-color: black; color: yellow; font-family: monospace; margin: 0; padding: 0; }
  .tile {
    border: 3px solid white;
    border-radius: 15px;
    padding: 20px;
    margin: 10px;
    cursor: pointer;
    transition: border-color 0.3s ease;
  }
  .tile:hover {
    border-color: yellow;
  }
  .media-player {
    position: fixed;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 60%;
    background: black;
    border: 2px solid yellow;
    z-index: 999;
  }
  .media-player video {
    width: 100%;
    height: 100%;
  }
  #reset {
    position: fixed;
    bottom: 10px;
    left: 10px;
    z-index: 1000;
    font-size: 16px;
  }
  #break-button {
    position: fixed;
    bottom: 10px;
    right: 10px;
    z-index: 1000;
  }
</style>
</head>
<body>

<div class="tile" data-file="sample1.mp4">Tile 1: sample1.mp4</div>
<div class="tile" data-file="sample2.mp4">Tile 2: sample2.mp4</div>

<button id="reset">RESET</button>
<button id="break-button">BREAK THE SPIRAL</button>

<div id="player" class="media-player" style="display: none;">
  <video id="video" controls autoplay></video>
</div>

<script>
  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const file = tile.getAttribute('data-file');
      const player = document.getElementById('player');
      const video = document.getElementById('video');
      video.src = file;
      player.style.display = 'block';
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    window.location.reload();
  });
</script>

</body>
</html>
