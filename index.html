    /* --- ENTRY SCREEN --- */
    #entry-screen, #wheel-overlay, #puzzle-grid {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
    }

    #puzzle-grid {
      display: none;
      flex-wrap: wrap;
      overflow-y: scroll;
      padding: 20px;
    }

    .tile {
      width: 150px;
      height: 100px;
      background: white;
      margin: 10px;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: black;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      overflow-y: auto;
      padding: 40px;
      color: white;
    }

    /* --- SOUNDTRACK TILE STYLE --- */
    .soundtrack-container {
      max-width: 800px;
      margin: auto;
    }

    .track {
      margin-bottom: 1.2em;
      border-bottom: 1px solid #444;
      padding-bottom: 1em;
    }

    .tile-image {
      border: 3px solid white;
      box-shadow: 0 0 12px white;
    }
  </style>
</head>
